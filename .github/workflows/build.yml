name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          # (0.53.1) No macOS build for now: the owner works on Windows and Linux. To bring it back:
          # - name: macOS
          #   # Intel machines: GitHub's Apple-chip ones were too few to start our job (Nov 2026).
          #   # The app is still universal (CMAKE_OSX_ARCHITECTURES: arm64 and x86_64).
          #   os: macos-15-intel
          # (and the macOS lines in the release job's "Zip each platform's app")
          - name: Windows
            os: windows-2022

    steps:
      - uses: actions/checkout@v5

      # Cloudflare's DNS for every name lookup on the Linux runner (the owner's workaround):
      # Azure's own resolver kept failing to find azure.archive.ubuntu.com (0.84.1, 0.85.0).
      # Google's as a fallback; "~." sends every domain to these servers, not the link's.
      - name: Use Cloudflare's DNS (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo mkdir -p /etc/systemd/resolved.conf.d
          printf '[Resolve]\nDNS=1.1.1.1 1.0.0.1\nFallbackDNS=8.8.8.8 8.8.4.4\nDomains=~.\n' \
            | sudo tee /etc/systemd/resolved.conf.d/cloudflare.conf
          sudo systemctl restart systemd-resolved || true
          resolvectl status | head -20 || true
          getent hosts azure.archive.ubuntu.com || echo "azure.archive.ubuntu.com not found yet"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        # Retried: GitHub's runners sometimes can't reach Ubuntu's package servers for a while
        # (0.84.1's builds failed on "Temporary failure resolving azure.archive.ubuntu.com").
        run: |
          packages="ninja-build xvfb \
            libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libxi-dev \
            libegl-dev libglu1-mesa-dev mesa-common-dev"
          options="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for attempt in 1 2 3 4 5; do
            if sudo apt-get $options update && sudo apt-get $options install -y $packages; then
              exit 0
            fi
            echo "Package install failed (attempt $attempt); trying again in $((attempt * 60)) s"
            sleep $((attempt * 60))
          done
          exit 1

      # ASIO on Windows: Steinberg's ASIO SDK, used under its GPLv3 option.
      # Downloaded from Steinberg, and only used if its licence text offers
      # the GPL; if anything here fails, Windows builds without ASIO (a
      # warning says so) rather than failing the release.
      - name: ASIO SDK (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/asio" && cd "$RUNNER_TEMP/asio"
          if curl -fsSL -o asiosdk.zip https://www.steinberg.net/asiosdk && 7z x -y asiosdk.zip > /dev/null; then
            header=$(find . -path '*common/iasiodrv.h' | head -1)
            if [ -n "$header" ] && grep -rliq "GNU General Public License" --include='*.txt' --include='*.md' . ; then
              sdk=$(cd "$(dirname "$header")/.." && pwd -W 2>/dev/null || pwd)
              echo "ASIO_SDK=$sdk" >> "$GITHUB_ENV"
              echo "ASIO SDK (GPLv3) at $sdk"
            else
              echo "::warning::The ASIO SDK downloaded, but no GPL licence text (or no headers) was found in it: building without ASIO"
            fi
          else
            echo "::warning::Couldn't download the ASIO SDK from steinberg.net: building without ASIO"
          fi
          exit 0

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then GENERATOR="-G Ninja"; fi
          ASIO=""
          if [ -n "$ASIO_SDK" ]; then ASIO="-DPARAGON_ASIO_SDK=$ASIO_SDK"; fi
          cmake -B build $GENERATOR -DCMAKE_BUILD_TYPE=Release $ASIO

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Unit tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a ctest --test-dir build -C Release --output-on-failure
          else
            ctest --test-dir build -C Release --output-on-failure
          fi

      - name: Upload the app
        uses: actions/upload-artifact@v7
        with:
          name: ParagonPR7S-${{ matrix.name }}
          path: |
            build/ParagonPR7S_artefacts/Release/Paragon PR7-S.exe
            build/ParagonPR7S_artefacts/Release/Paragon PR7-S.pdb
            build/ParagonPR7S_artefacts/Release/Paragon PR7-S.app
            build/ParagonPR7S_artefacts/Release/Paragon PR7-S

  # Publishes a GitHub Release whenever a push carries a version number
  # (in CMakeLists.txt) that hasn't been released yet: bump the version and
  # add a CHANGELOG.md section, push, and the release appears, with the
  # three builds above, zipped, and notes from CHANGELOG.md.
  release:
    name: Release
    # (0.85.0, the owner: "if the Linux build fails still release the Windows build")
    # Runs even when a build job failed; publishes whichever apps were built, as long as
    # Windows' is one of them. A later push at the same version adds a missing Linux zip.
    if: ${{ !cancelled() && github.event_name == 'push' }}
    needs: build
    runs-on: ubuntu-24.04
    # One release job at a time: a second push while one is publishing waits,
    # then finds the version released and does nothing (no race to publish).
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write   # needed to create the tag and release
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5

      - name: Is this version already released?
        id: version
        run: |
          VERSION=$(sed -n 's/^project(ParagonPR7S VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          TAG="v${VERSION}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Released without the Linux zip (its build had failed): add it if it's built now.
            if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -q -- '-Linux\.zip$'; then
              echo "${TAG} is already released; nothing to do."
              echo "publish=false" >> "$GITHUB_OUTPUT"
            else
              echo "${TAG} is released without its Linux zip; adding it if this run built Linux."
              echo "publish=add" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        if: steps.version.outputs.publish != 'false'
        with:
          path: artifacts

      # The studio's synth (0.9.11): PR7-K's latest release, its VST3 beside
      # the app in each zip (the app looks there first). If it can't be had,
      # the release goes out without it (the app then uses the old synth).
      - name: PR7-K, the studio's synth
        if: steps.version.outputs.publish != 'false'
        run: |
          mkdir pr7k
          if gh release download --repo ARYEZ/Paragon-PR7-K --pattern "*-VST3.zip" --dir pr7k; then
            for os in Windows Linux; do
              [ -d "artifacts/ParagonPR7S-${os}" ] || continue
              zip=$(ls pr7k/*-${os}-VST3.zip 2>/dev/null | head -1)
              if [ -n "$zip" ]; then
                unzip -q "$zip" -d "artifacts/ParagonPR7S-${os}/"
                echo "PR7-K for ${os}: $(basename "$zip")"
              else
                echo "::warning::No PR7-K VST3 for ${os} in its latest release"
              fi
            done
          else
            echo "::warning::PR7-K's latest release couldn't be downloaded; the zips go out without it"
          fi

      - name: Zip each platform's app
        if: steps.version.outputs.publish != 'false'
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          mkdir release
          haveWindows=false; haveLinux=false
          [ -e "artifacts/ParagonPR7S-Windows/Paragon PR7-S.exe" ] && haveWindows=true
          [ -e "artifacts/ParagonPR7S-Linux/Paragon PR7-S" ] && haveLinux=true
          if [ "${{ steps.version.outputs.publish }}" = "true" ] && [ "$haveWindows" != true ]; then
            echo "::error::The Windows build is missing; nothing is released"
            exit 1
          fi
          if [ "$haveLinux" != true ]; then
            echo "::warning::The Linux build failed or is missing; releasing without the Linux zip"
          fi
          # Artifact storage drops file permissions; put the executable flag
          # back on the macOS and Linux apps (and PR7-K's binaries).
          if [ "$haveLinux" = true ]; then
            chmod -R a+x "artifacts/ParagonPR7S-Linux/Paragon PR7-S"
            chmod -R a+x artifacts/ParagonPR7S-Linux/*.vst3/Contents/x86_64-linux 2>/dev/null || true
          fi
          # Each zip: the app, its .pdb on Windows (names in the session log's
          # crash entries), and PR7-K's VST3 if it was fetched.
          pack() {   # folder, zip name, app, zip flags
            # (0.52.3) The icon for an Elgato Stream Deck's keys (the owner asked), in a folder beside the app.
            mkdir -p "artifacts/$1/Stream Deck icons" && cp resources/icon/stream-deck-*.png "artifacts/$1/Stream Deck icons/"
            (cd "artifacts/$1" && files=("$3" "Stream Deck icons") && { [ -e "Paragon PR7-S.pdb" ] && files+=("Paragon PR7-S.pdb"); true; } \
               && { [ -e "Paragon PR7-K.vst3" ] && files+=("Paragon PR7-K.vst3"); true; } \
               && zip $4 "../../release/$2" "${files[@]}")
          }
          # (adding a missing Linux zip to a release: Linux only)
          if [ "$haveWindows" = true ] && [ "${{ steps.version.outputs.publish }}" = "true" ]; then
            pack ParagonPR7S-Windows "ParagonPR7-S-${TAG}-Windows.zip" "Paragon PR7-S.exe" -qr
          fi
          # pack ParagonPR7S-macOS "ParagonPR7-S-${TAG}-macOS.zip" "Paragon PR7-S.app" -qry   (no macOS build for now)
          if [ "$haveLinux" = true ]; then
            pack ParagonPR7S-Linux "ParagonPR7-S-${TAG}-Linux.zip" "Paragon PR7-S" -qr
          fi
          ls -l release

      - name: Write the release notes
        if: steps.version.outputs.publish == 'true'
        run: |
          awk -v version="${{ steps.version.outputs.version }}" '
            /^## / { printing = ($2 == version) ; next }
            printing { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for ${{ steps.version.outputs.version }}" >&2
            exit 1
          fi
          cat .github/release-install.md >> notes.md

      # Retried: GitHub's upload can drop mid-way ("stream error ... CANCEL",
      # which kept 0.4.0 from being published the first time). A half-made
      # release from a failed try is removed before the next.
      - name: Add the Linux zip to the release
        if: steps.version.outputs.publish == 'add'
        run: |
          if ls release/*-Linux.zip > /dev/null 2>&1; then
            gh release upload "${{ steps.version.outputs.tag }}" release/*-Linux.zip
          else
            echo "::warning::Linux still not built; the release stays Windows only"
          fi

      - name: Publish the release
        if: steps.version.outputs.publish == 'true'
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          for attempt in 1 2 3; do
            if gh release create "$TAG" release/*.zip \
                 --target "$GITHUB_SHA" \
                 --title "Paragon PR7-S ${TAG}" \
                 --notes-file notes.md; then
              exit 0
            fi
            echo "::warning::Publishing ${TAG} failed (attempt ${attempt}); trying again"
            gh release delete "$TAG" --yes --cleanup-tag > /dev/null 2>&1 || true
            sleep 20
          done
          exit 1
